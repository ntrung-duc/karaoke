<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151510"><title>Rạp Âm · Nhà hát karaoke</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/lib/three.module.js","three/addons/":"/lib/"}}</script></head><body>
<main><div id="view"><div id="pad"><button data-key="w">↑</button><div><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><button id="jump" aria-label="Nhảy">Nhảy ↑</button></div></div>
<header><div class="brand">♫</div><div><h1>Nhà hát Iron Dome</h1><span id="status">Đang kết nối</span></div></header>
<nav aria-label="Điều khiển phòng"><button data-panel="music" aria-controls="drawer" aria-expanded="false"><b>♫</b>Chọn bài</button><button data-panel="room" aria-controls="drawer" aria-expanded="false"><b>☷</b>Phòng hát</button></nav>
<footer><span id="angle">Góc nhìn avatar</span><span class="hint">WASD di chuyển · Shift chạy · Space nhảy · Kéo xoay camera · Cuộn chuột đổi góc nhìn</span></footer>
<aside id="drawer" aria-labelledby="panel-title" hidden><div class="row"><h2 id="panel-title">Phòng hát</h2><button id="close" aria-label="Đóng bảng">×</button></div>
<section id="room" hidden><div class="controls"><button id="camera">Đổi góc nhìn</button><button id="sit">Đứng dậy</button><button id="mic" disabled>Bật mic</button><button id="next" hidden>Kết thúc lượt</button><button id="invite">Mời bạn bè</button></div><label for="name">Tên của bạn</label><input id="name" maxlength="24" placeholder="Nhập tên hiển thị"><fieldset class="appearance"><legend>Avatar của bạn</legend><label for="skin-picker">Màu da</label><select id="skin-picker" aria-label="Màu da avatar"></select><label>Khuôn mặt</label><div id="face-picker" role="group" aria-label="Chọn khuôn mặt"></div><p class="appearance-help">Góc thứ ba: kéo xoay camera, đầu giữ nguyên. Cuộn vào góc thứ nhất để đầu nhìn theo camera.</p></fieldset><hr><h3>Trong phòng <span id="total">0</span></h3><div id="people"></div></section><section id="music"><form id="form"><label for="url">Liên kết YouTube</label><input id="url" required placeholder="Dán link video karaoke…"><label for="title">Tên bài <em>(tuỳ chọn)</em></label><input id="title" maxlength="80" placeholder="Tên bài hát"><button class="primary">＋　Đăng ký lượt hát</button></form><hr><h3>Lượt hát <span id="count">0</span></h3><div id="songs"></div></section></aside><p id="notice" role="status"></p></main>
<script type="module" src="/app.js"></script></body></html>
